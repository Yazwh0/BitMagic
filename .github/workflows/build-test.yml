name: Build

on:
  push:
    branches: ["main", "develop"]

jobs:
  build-core:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3.0.0

      - name: Build Emulator Core
        run: msbuild 'BitMagic.X16Emulator/X16Emulator/EmulatorCore/EmulatorCore.vcxproj' /p:configuration=Release /p:platform=x64

      # core.obj is the portable input build-linux links into EmulatorCore.so; EmulatorCore.dll
      # is what build-windows needs directly. Split out so build-windows and build-linux can run
      # in parallel off this one small job instead of build-linux waiting on the full Windows build.
      - name: Save Core Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: EmulatorCore
          path: BitMagic.X16Emulator\X16Emulator\EmulatorCore\x64\Release\core.obj

      - name: Save Core DLL Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: EmulatorCoreDll
          path: BitMagic.X16Emulator\X16Emulator\EmulatorCore\x64\Release\EmulatorCore.dll

  build-windows:
    needs: build-core
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download Core
        uses: actions/download-artifact@v4
        with:
          name: EmulatorCoreDll
          path: BitMagic.X16Emulator\X16Emulator\EmulatorCore\x64\Release

      - name: Build Debugger
        run: dotnet build 'BitMagic.X16Debugger/X16D/X16D.csproj' /p:configuration=Release --nologo

      - name: Build TemplateRunner
        run: dotnet build 'BitMagic.TemplateEngine/BitMagic.TemplateEngine.Runner' /p:configuration=Release --nologo

      - name: Copy Core to Debugger
        run : copy-item 'BitMagic.X16Emulator\X16Emulator\EmulatorCore\x64\Release\EmulatorCore.dll' -Destination 'BitMagic.X16Debugger\X16D\bin\Release\net6.0\EmulatorCore.dll'

      - name: Build Emulator
        run: dotnet build 'BitMagic.X16Emulator/X16E/X16E.csproj' /p:configuration=Release --nologo

      - name: Copy Core to Emulator
        run: copy-item 'BitMagic.X16Emulator\X16Emulator\EmulatorCore\x64\Release\EmulatorCore.dll' -Destination 'BitMagic.X16Emulator\X16E\bin\Release\net6.0\EmulatorCore.dll'

      - name: Copy TemplateRunner to Debugger
        run: |
          new-item 'BitMagic.X16Debugger\X16D\bin\Release\net6.0\TemplateEngine' -type directory -force
          copy-item 'BitMagic.TemplateEngine\BitMagic.TemplateEngine.Runner\bin\Release\net6.0\*.*' -Destination 'BitMagic.X16Debugger\X16D\bin\Release\net6.0\TemplateEngine' -Recurse -Force

      - name: Create Version File
        run: |
          echo "${{ github.sha }}" > BitMagic.X16Emulator/X16E/bin/Release/net6.0/version.txt
          echo "${{ github.sha }}" > BitMagic.X16Debugger/X16D/bin/Release/net6.0/version.txt

      - name: Archive Emulator
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: 'zip'
          filename: 'BitMagic-TheEmulator.Windows.zip'
          directory: BitMagic.X16Emulator/X16E/bin/Release/net6.0

      - name: Archive Debugger
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: 'zip'
          filename: 'BitMagic-TheDebugger.Windows.zip'
          directory: BitMagic.X16Debugger/X16D/bin/Release/net6.0

      - name: Setup VS Dev
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      # - name: Build MSI
      #   working-directory: BitMagic.X16Emulator
      #   run: devenv.com BitMagic.X16Emulator.sln /project X16ESetup\X16ESetup.vdproj /build "Release|x64"

      # - name: Save Emulator Setup Artifacts
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: BitMagic-Setup
      #     path: BitMagic.X16Emulator\X16ESetup\Release\X16ESetup.msi

      - name: Save Emulator Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: BitMagic-TheEmulator
          path: BitMagic.X16Emulator/X16E/bin/Release/net6.0/BitMagic-TheEmulator.Windows.zip

      - name: Save Debugger Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: BitMagic-TheDebugger
          path: BitMagic.X16Debugger/X16D/bin/Release/net6.0/BitMagic-TheDebugger.Windows.zip

  build-linux:
    needs: build-core
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      # 8.0 runtime is needed by the ZiModem vendoring tool (tools/Vendoring targets
      # net8.0, run by the CMake build below); 10.0 keeps the C# project builds on the
      # same SDK the runner image already uses.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Copy artifacts
        uses: actions/download-artifact@v4
        with:
          name: EmulatorCore
          path: BitMagic.X16Emulator/X16Emulator/EmulatorCoreLinux

      - name: Build Core Wrapper
        working-directory: BitMagic.X16Emulator/X16Emulator/EmulatorCoreLinux
        run: |
          ls -l
          md5sum core.obj
          chmod +x build.sh
          ./build.sh
          ls -l

      - name: Copy Wrapper to Emulator
        run: |
          mkdir -p BitMagic.X16Emulator/X16Emulator/EmulatorCore/x64/Release
          cp BitMagic.X16Emulator/X16Emulator/EmulatorCoreLinux/EmulatorCore.so BitMagic.X16Emulator/X16Emulator/EmulatorCore/x64/Release/.

      # The Linux core is a prebuilt core.obj linked by build.sh, so unlike the Windows
      # job (where the EmulatorCore.vcxproj build triggers this) nothing has built the
      # ZiModem host .so yet. BitMagic.X16Emulator.csproj <Content>-copies
      # build/native/bin/libzimodem_host.so, so it must exist before "Build Debugger".
      # cmake / gcc / make ship on the ubuntu-24.04 image.
      #
      # ZIMODEM_HOST_MSABI=ON: the emulator core calls this .so from hand-written x64 MASM
      # that uses the Windows calling convention on every platform, so this dedicated copy
      # is compiled with __attribute__((ms_abi)) on its ABI boundary. It forbids building
      # the (SysV-convention) test suites, hence tests OFF.
      - name: Build ZiModem Host
        working-directory: External/BitMagic.ZiModem
        run: |
          cmake -S native -B build/native -DZIMODEM_HOST_MSABI=ON -DZIMODEM_BUILD_TESTS=OFF
          cmake --build build/native --target zimodem_host -j"$(nproc)"
          ls -l build/native/bin

      - name: Build Debugger
        run: dotnet build 'BitMagic.X16Debugger/X16D/X16D.csproj' /p:configuration=Release --nologo

      - name: Build TemplateRunner
        run: dotnet build 'BitMagic.TemplateEngine/BitMagic.TemplateEngine.Runner' /p:configuration=Release --nologo

      - name: Copy TemplateRunner to Debugger
        run: |
          mkdir BitMagic.X16Debugger/X16D/bin/Release/net6.0/TemplateEngine
          cp -R -v BitMagic.TemplateEngine/BitMagic.TemplateEngine.Runner/bin/Release/net6.0/* BitMagic.X16Debugger/X16D/bin/Release/net6.0/TemplateEngine

      - name: Copy Wrapper
        run: |
          cp BitMagic.X16Emulator/X16Emulator/EmulatorCoreLinux/EmulatorCore.so BitMagic.X16Debugger/X16D/bin/Release/net6.0/.

      - name: Build Emulator
        run: dotnet build 'BitMagic.X16Emulator/X16E/X16E.csproj' /p:configuration=Release --nologo

      - name: Copy Wrapper to Emulator
        run: |
          cp BitMagic.X16Emulator/X16Emulator/EmulatorCoreLinux/EmulatorCore.so BitMagic.X16Emulator/X16E/bin/Release/net6.0/.

      - name: Create Version File
        run: |
          echo "${{ github.sha }}" > BitMagic.X16Debugger/X16D/bin/Release/net6.0/version.txt
          echo "${{ github.sha }}" > BitMagic.X16Emulator/X16E/bin/Release/net6.0/version.txt

      - name: Archive Debugger
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: 'tar'
          filename: '../../../../../BitMagic-TheDebugger.Linux.tar.gz'
          directory: BitMagic.X16Debugger/X16D/bin/Release/net6.0

      - name: Archive Emulator
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: 'tar'
          filename: '../../../../../BitMagic-TheEmulator.Linux.tar.gz'
          directory: BitMagic.X16Emulator/X16E/bin/Release/net6.0

      - name: Save Linux Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: BitMagic-Linux
          path: |
            BitMagic-TheDebugger.Linux.tar.gz
            BitMagic-TheEmulator.Linux.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Create Version File
        run: echo "${{ github.sha }}" > version.txt

      # - name: Copy artifacts (Setup)
      #   uses: actions/download-artifact@v3
      #   with:
      #     name: BitMagic-Setup
      #     path: .

      - name: Copy artifacts (Debugger)
        uses: actions/download-artifact@v4
        with:
          name: BitMagic-TheDebugger
          path: .

      - name: Copy artifacts (Emulator)
        uses: actions/download-artifact@v4
        with:
          name: BitMagic-TheEmulator
          path: .

      - name: Copy artifacts (Linux)
        uses: actions/download-artifact@v4
        with:
          name: BitMagic-Linux
          path: .

      - name: Create Github Release
        uses: softprops/action-gh-release@v3.0.3
        if: github.ref == 'refs/heads/main'
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          tag_name: "latest"
          target_commitish: "${{ github.sha }}"
          name: "Release Build"
          files: |
            BitMagic-TheDebugger.Linux.tar.gz
            BitMagic-TheEmulator.Linux.tar.gz
            BitMagic-TheEmulator.Windows.zip
            BitMagic-TheDebugger.Windows.zip
            version.txt

      - name: Create Github Development Release
        uses: softprops/action-gh-release@v3.0.3
        if: github.ref == 'refs/heads/develop'
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          tag_name: "prerelease"
          target_commitish: "${{ github.sha }}"
          name: "Development Build"
          files: |
            BitMagic-TheDebugger.Linux.tar.gz
            BitMagic-TheEmulator.Linux.tar.gz
            BitMagic-TheEmulator.Windows.zip
            BitMagic-TheDebugger.Windows.zip
            version.txt
